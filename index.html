        對於未來，我正積極往人資管理職深耕，持續吸收進階知識與最新的法規實務，並結合解決問題的即戰力。我誠摯希望能加入貴公司，參與年度招募策略規劃與制度優化執行。我將全力展現上進心與執行力，在最短時間內化組織需求，將我的數位思維與制度建構經驗，轉化為推動公司發展的實質動能。
      </p>
      `;

      // --- 3. React Components ---

      // Component: SectionHeading
      const SectionHeading = ({ title, className = '' }) => {
        return (
          <div className={`mb-12 ${className}`}>
            <h2 className="text-3xl font-bold uppercase tracking-[0.2em] text-gray-900 relative inline-block">
              {title}
              <span className="absolute -bottom-4 left-0 w-12 h-1 bg-sky-600 rounded-full"></span>
            </h2>
          </div>
        );
      };

      // Component: Navbar
      const Navbar = () => {
        const [isOpen, setIsOpen] = useState(false);
        const [activeId, setActiveId] = useState('profile');

        const NAV_ITEMS = [
          { id: 'profile', label: '個人資料' },
          { id: 'experience', label: '工作經歷' },
          { id: 'skills', label: '專業技能' },
          { id: 'autobiography', label: '自傳' },
          { id: 'conditions', label: '求職條件' },
          { id: 'capabilities', label: '證照與獎項' },
        ];

        const scrollToSection = (id) => {
          const element = document.getElementById(id);
          if (element) {
            element.scrollIntoView({ behavior: 'smooth' });
            setIsOpen(false);
            setActiveId(id);
          }
        };

        useEffect(() => {
          const handleScroll = () => {
            const scrollPosition = window.scrollY + 100;
            for (const item of NAV_ITEMS) {
              const element = document.getElementById(item.id);
              if (element) {
                const { offsetTop, offsetHeight } = element;
                if (scrollPosition >= offsetTop && scrollPosition < offsetTop + offsetHeight) {
                  setActiveId(item.id);
                }
              }
            }
          };
          window.addEventListener('scroll', handleScroll);
          return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        return (
          <nav className="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-200 shadow-sm">
            <div className="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
              <div 
                className="text-lg md:text-xl font-bold tracking-tight text-gray-900 cursor-pointer"
                onClick={() => scrollToSection('profile')}
              >
                若是不努力，成功的故事都是別人的
              </div>

              {/* Desktop Menu */}
              <div className="hidden md:flex space-x-8">
                {NAV_ITEMS.map((item) => (
                  <button
                    key={item.id}
                    onClick={() => scrollToSection(item.id)}
                    className={`text-sm font-medium transition-colors duration-300 uppercase tracking-wide
                      ${activeId === item.id ? 'text-sky-600 font-bold' : 'text-gray-500 hover:text-sky-600'}
                    `}
                  >
                    {item.label}
                  </button>
                ))}
              </div>

              {/* Mobile Menu Button */}
              <div className="md:hidden">
                <button 
                  onClick={() => setIsOpen(!isOpen)}
                  className="text-gray-700 hover:text-sky-600 focus:outline-none"
                >
                  {isOpen ? <Icons.X size={24} /> : <Icons.Menu size={24} />}
                </button>
              </div>
            </div>

            {/* Mobile Dropdown */}
            {isOpen && (
              <div className="md:hidden bg-white border-b border-gray-100 absolute w-full px-6 py-4 shadow-lg">
                <div className="flex flex-col space-y-4">
                  {NAV_ITEMS.map((item) => (
                    <button
                      key={item.id}
                      onClick={() => scrollToSection(item.id)}
                      className={`text-left text-sm font-medium uppercase tracking-wide
                        ${activeId === item.id ? 'text-sky-600 font-bold' : 'text-gray-500'}
                      `}
                    >
                      {item.label}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </nav>
        );
      };

      // Component: Timeline
      const Timeline = ({ items }) => {
        return (
          <div className="relative border-l-2 border-gray-200 ml-3 md:ml-6 space-y-12 py-4">
            {items.map((item) => (
              <div key={item.id} className="relative pl-8 md:pl-12 group">
                {/* Dot Indicator */}
                <div className="absolute -left-[9px] top-1.5 w-[18px] h-[18px] bg-white border-[3px] border-gray-300 rounded-full group-hover:border-sky-600 transition-colors duration-300"></div>
                
                {/* Header Line */}
                <div className="flex flex-col sm:flex-row sm:items-baseline mb-2">
                  <h3 className="text-xl font-bold text-gray-900 mr-4 group-hover:text-sky-600 transition-colors">{item.title}</h3>
                  <span className="text-sm font-medium text-gray-500 flex items-center mt-1 sm:mt-0">
                    <Icons.Calendar size={14} className="mr-1.5" />
                    {item.date}
                  </span>
                </div>
                
                <h4 className="text-lg font-semibold text-gray-600 mb-4">{item.subtitle}</h4>
                
                {/* Core Value */}
                {item.coreValue && (
                  <div className="mb-4 text-sm font-semibold text-sky-700 bg-sky-50 px-3 py-2 rounded inline-block">
                    核心價值：{item.coreValue}
                  </div>
                )}

                {/* Achievements */}
                {item.achievements && item.achievements.length > 0 && (
                  <div className="mb-5">
                    <h5 className="text-md font-bold text-gray-900 mb-2 border-l-4 border-sky-600 pl-2">績效成果</h5>
                    <ul className="space-y-2">
                      {item.achievements.map((desc, idx) => (
                        <li key={idx} className="text-gray-600 leading-relaxed text-sm relative pl-4">
                          <span className="absolute left-0 top-2.5 w-1.5 h-1.5 bg-sky-600 rounded-full"></span>
                          <span dangerouslySetInnerHTML={{ __html: desc }} />
                        </li>
                      ))}
                    </ul>
                  </div>
                )}

                {/* Responsibilities */}
                {item.responsibilities && item.responsibilities.length > 0 && (
                  <div className="mb-5">
                    <h5 className="text-md font-bold text-gray-900 mb-2 border-l-4 border-gray-300 pl-2">工作內容</h5>
                    <ul className="space-y-2">
                      {item.responsibilities.map((desc, idx) => (
                        <li key={idx} className="text-gray-600 leading-relaxed text-sm relative pl-4">
                          <span className="absolute left-0 top-2.5 w-1.5 h-1.5 bg-gray-400 rounded-full"></span>
                          <span dangerouslySetInnerHTML={{ __html: desc }} />
                        </li>
                      ))}
                    </ul>
                  </div>
                )}

                {/* Fallback for simple description (e.g., Education) */}
                {item.description && item.description.length > 0 && (
                  <ul className="space-y-2">
                    {item.description.map((desc, idx) => (
                      <li key={idx} className="text-gray-600 leading-relaxed text-sm relative pl-4">
                        <span className="absolute left-0 top-2 w-1.5 h-1.5 bg-gray-400 rounded-full"></span>
                        <span dangerouslySetInnerHTML={{ __html: desc }} />
                      </li>
                    ))}
                  </ul>
                )}
              </div>
            ))}
          </div>
        );
      };

      // Component: App
      const App = () => {
        // Split the name for custom rendering: "王曜瑄" big, "Well" small and no parens
        const nameParts = PROFILE.name.split(' ');
        const zhName = nameParts[0] || PROFILE.name;
        const enName = nameParts[1] || '';

        return (
          <div className="min-h-screen flex flex-col font-sans">
            <Navbar />

            <main className="flex-grow">
              {/* Profile Section */}
              <section id="profile" className="pt-20 pb-16 md:pt-32 md:pb-24 px-6 bg-white">
                <div className="max-w-5xl mx-auto">
                  {/* Top Info Block (Avatar removed as requested) */}
                  <div className="flex flex-col items-start gap-10">
                    <div className="text-left w-full">
                      <h1 className="text-4xl md:text-6xl font-extrabold text-gray-900 tracking-tight mb-4 flex items-baseline gap-4">
                        {zhName}
                        {enName && <span className="text-2xl md:text-3xl text-gray-600 font-semibold">{enName}</span>}
                      </h1>
                      <p className="text-xl md:text-2xl text-gray-500 font-medium mb-8 leading-relaxed max-w-3xl">
                        {PROFILE.title}
                      </p>
                      
                      <div className="flex flex-wrap gap-4 md:gap-6 text-sm md:text-base text-gray-600 mb-8">
                        <div className="flex items-center gap-2 hover:text-sky-600 transition-colors">
                          <Icons.Mail size={18} className="text-sky-600" />
                          <a href={`mailto:${PROFILE.email}`}>{PROFILE.email}</a>
                        </div>
                        <div className="flex items-center gap-2 hover:text-sky-600 transition-colors">
                          <Icons.Phone size={18} className="text-sky-600" />
                          <span>{PROFILE.phone}</span>
                        </div>
                        <div className="flex items-center gap-2 hover:text-sky-600 transition-colors">
                          <Icons.MapPin size={18} className="text-sky-600" />
                          <span>{PROFILE.location}</span>
                        </div>
                      </div>

                      <div className="flex flex-wrap gap-4">
                        {PROFILE.linkedin && (
                          <a href={`https://${PROFILE.linkedin}`} target="_blank" rel="noreferrer" className="flex items-center gap-2 px-6 py-2.5 bg-sky-600 text-white rounded-md text-sm font-semibold hover:bg-sky-700 transition-all hover:shadow-lg shadow-sky-200">
                            <Icons.Linkedin size={18} /> LinkedIn
                          </a>
                        )}
                        {PROFILE.github && (
                          <a href={`https://${PROFILE.github}`} target="_blank" rel="noreferrer" className="flex items-center gap-2 px-6 py-2.5 bg-white text-gray-900 border border-sky-200 rounded-md text-sm font-semibold hover:bg-sky-50 hover:border-sky-300 transition-all">
                            <Icons.Github size={18} className="text-sky-600" /> GitHub
                          </a>
                        )}
                        <button className="flex items-center gap-2 px-6 py-2.5 bg-white text-gray-900 border border-gray-200 rounded-md text-sm font-semibold hover:border-sky-600 hover:text-sky-600 transition-all">
                          <Icons.Download size={18} /> 下載履歷 PDF
                        </button>
                      </div>
                    </div>
                  </div>
                  
                  {/* Profile Summary Section */}
                  <div className="mt-16 bg-sky-50/50 p-8 rounded-2xl border border-sky-100">
                    <div className="flex flex-wrap gap-2 mb-6 justify-start">
                      {PROFILE.summaryTags.map((tag, i) => (
                        <span key={i} className="px-3 py-1 bg-sky-600 text-white text-sm font-medium rounded-full shadow-sm">
                          {tag}
                        </span>
                      ))}
                    </div>
                    <div className="grid grid-cols-1 gap-6">
                      {PROFILE.summaryItems.map((item, index) => (
                        <div key={index} className="flex gap-4 items-start">
                            <div className="mt-1 text-sky-600 shrink-0">
                              <Icons.Sparkles size={20} className="fill-sky-600 text-sky-600" />
                            </div>
                            <div>
                              <h4 className="font-bold text-lg text-gray-900 mb-1">
                                {item.title}
                              </h4>
                              <p className="text-gray-600 leading-relaxed" dangerouslySetInnerHTML={{ __html: item.content }}></p>
                            </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Education embedded in Profile section */}
                  <div className="mt-20">
                    <h3 className="text-xl font-bold uppercase tracking-widest text-gray-400 mb-8 border-b border-gray-100 pb-4">學歷 (Education)</h3>
                    <Timeline items={EDUCATION} />
                  </div>
                </div>
              </section>

              {/* Experience Section */}
              <section id="experience" className="py-20 bg-gray-50 px-6 border-t border-gray-200">
                <div className="max-w-5xl mx-auto">
                  <SectionHeading title="工作經歷" />
                  <Timeline items={EXPERIENCE} />
                </div>
              </section>

              {/* Skills Section */}
              <section id="skills" className="py-20 bg-white px-6 border-t border-gray-200">
                <div className="max-w-5xl mx-auto">
                  <SectionHeading title="專業技能" />
                  <div className="grid grid-cols-1 gap-10">
                    {SKILLS.map((skillGroup, index) => (
                      <div key={index} className="bg-white p-8 rounded-2xl border border-gray-100 hover:border-sky-300 hover:shadow-lg hover:shadow-sky-100/50 transition-all duration-300 group">
                        <h3 className="text-2xl font-bold text-gray-900 mb-6 pb-3 border-b border-gray-100 group-hover:border-sky-100 flex items-center">
                          <Icons.CheckCircle className="mr-3 text-sky-600" size={24} />
                          {skillGroup.category}
                        </h3>
                        
                        {/* Detailed descriptions */}
                        <div className="space-y-4 mb-6">
                          {skillGroup.items.map((item, idx) => (
                            <div key={idx} className="flex flex-col sm:flex-row sm:items-baseline gap-2">
                              <span className="font-bold text-gray-800 shrink-0 whitespace-nowrap">{item.title}：</span>
                              <span className="text-gray-600 leading-relaxed">{item.description}</span>
                            </div>
                          ))}
                        </div>

                        {/* Hashtags row */}
                        <div className="flex flex-wrap gap-3 pt-2">
                          {skillGroup.tags.map((tag, idx) => (
                            <span key={idx} className="px-4 py-1.5 bg-sky-50 border border-sky-100 rounded-lg text-sm text-sky-700 font-medium hover:bg-sky-100 hover:border-sky-300 transition-colors">
                              {tag}
                            </span>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>

              {/* Autobiography Section */}
              <section id="autobiography" className="py-20 bg-gray-50 px-6 border-t border-gray-200">
                <div className="max-w-3xl mx-auto text-center md:text-left">
                  <SectionHeading title="自傳" className="text-center" />
                  <div 
                    className="prose prose-lg text-gray-600 mx-auto leading-loose text-justify"
                    dangerouslySetInnerHTML={{ __html: AUTOBIOGRAPHY_TEXT }}
                  >
                  </div>
                </div>
              </section>

              {/* Job Conditions Section */}
              <section id="conditions" className="py-20 bg-white px-6 border-t border-gray-200">
                <div className="max-w-5xl mx-auto">
                  <SectionHeading title="求職條件" />
                  <div className="mb-8 -mt-8 text-gray-500 text-sm">隨時準備迎接新挑戰</div>
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-6">
                      {CONDITIONS.map((item, idx) => (
                        <div key={idx} className="bg-white p-6 rounded-lg border border-gray-200 hover:border-sky-400 hover:shadow-md hover:shadow-sky-100 transition-all duration-300 group">
                          <p className="text-gray-500 text-xs uppercase tracking-wider font-semibold mb-2 group-hover:text-sky-600 transition-colors">{item.label}</p>
                          <p className="text-lg font-bold text-gray-900 whitespace-pre-line leading-relaxed">{item.value}</p>
                        </div>
                      ))}
                  </div>
                </div>
              </section>

              {/* Capabilities / Certificates Section */}
              <section id="capabilities" className="py-20 bg-gray-50 px-6 border-t border-gray-200">
                <div className="max-w-5xl mx-auto">
                  <SectionHeading title="證照與其他專長" />
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {CERTIFICATES.map((cert, idx) => (
                      <div key={idx} className="flex items-center p-6 rounded-xl border border-gray-200 hover:shadow-md hover:border-sky-300 transition-all duration-300 bg-white group">
                          <div className="bg-sky-50 p-3 rounded-full shadow-sm border border-sky-100 mr-5 shrink-0 text-sky-600 group-hover:bg-sky-100 transition-colors">
                            <Icons.Award size={24} />
                          </div>
                          <div>
                            <h3 className="text-lg font-bold text-gray-900">{cert.name}</h3>
                          </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            </main>

            {/* Footer */}
            <footer className="bg-white border-t border-gray-200 py-12 px-6">
              <div className="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center text-sm text-gray-500">
                <p>&copy; {new Date().getFullYear()} {PROFILE.name}. All Rights Reserved.</p>
                <div className="flex space-x-6 mt-4 md:mt-0">
                  <a href="#" className="hover:text-sky-600 transition-colors">Privacy Policy</a>
                  <a href={`mailto:${PROFILE.email}`} className="hover:text-sky-600 transition-colors">Contact</a>
                </div>
              </div>
            </footer>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
